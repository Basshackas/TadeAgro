async function decryptApp(code){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct)))}

async function unlock(code,keep,silent){
 if(!(window.crypto&&crypto.subtle)){$('msg').textContent='Open this page over https (the web address must start with https://).';return}
 $('go').disabled=true;$('msg').style.color='#66726A';$('msg').textContent='Unlocking...';
 try{const html=await decryptApp(code.trim().toUpperCase());if(keep){try{localStorage.setItem('ta_code',code.trim().toUpperCase())}catch(e){}}launch(html)}
 catch(e){try{localStorage.removeItem('ta_code')}catch(x){}$('go').disabled=false;$('msg').style.color='#B23A2B';$('msg').textContent=silent?'':'That access code is not right.'}}
$('f').addEventListener('submit',e=>{e.preventDefault();unlock($('code').value,$('keep').checked,false)});
try{const c=localStorage.getItem('ta_code');if(c)unlock(c,true,true)}catch(e){}
</script></body></html>
